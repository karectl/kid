# The Argo CD "app of apps".
#
# This file is a template: bootstrap.sh fills in ${KID_GITOPS_REPO},
# ${KID_GITOPS_REVISION} and ${KID_ENABLE_KYVERNO} with envsubst and applies
# it. Don't `kubectl apply` it directly.
#
# It points Argo CD at gitops/apps, a tiny Helm chart that renders one Argo CD
# Application per component (and per research project), all following the
# same repository and branch.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ${KID_GITOPS_REPO}
    targetRevision: ${KID_GITOPS_REVISION}
    path: gitops/apps
    helm:
      valuesObject:
        repoURL: ${KID_GITOPS_REPO}
        revision: ${KID_GITOPS_REVISION}
        kyverno:
          enabled: ${KID_ENABLE_KYVERNO}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
