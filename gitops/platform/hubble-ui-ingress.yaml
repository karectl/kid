# Hubble UI is installed by the Cilium CLI (bootstrap.sh) with
# hubble.ui.baseUrl=/hubble/, so it can be served under a sub-path.
#
# NOTE: Hubble UI has no login. Fine for a throw-away training cluster; in a
# real TRE put it behind an authenticating proxy or keep it internal.
# The UI only serves /hubble/, so send bare /hubble there (relative, to keep https).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hubble-ui-trailing-slash
  namespace: kube-system
spec:
  redirectRegex:
    regex: "^https?://[^/]+/hubble$"
    replacement: "/hubble/"
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubble-ui
  namespace: kube-system
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-hubble-ui-trailing-slash@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /hubble
            pathType: Prefix
            backend:
              service:
                name: hubble-ui
                port:
                  number: 80
