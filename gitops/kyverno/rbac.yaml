# Kyverno can only generate resources it is allowed to create. The labels
# below "aggregate" these rules into Kyverno's own ClusterRoles, so we extend
# its permissions without editing the Helm chart.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:generate-ciliumnetworkpolicies
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
