apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict image registries
    policies.kyverno.io/category: TRE workspaces
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Workspaces may only run images from the approved Jupyter registry path.
      In a real TRE this would be the organisation's own scanned, signed
      registry, so researchers can't bring arbitrary software (and data) in.
spec:
  background: true
  rules:
    - name: approved-registry-only
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels:
                  k8tre.io/type: project
      validate:
        failureAction: Enforce
        message: >-
          Image {{ request.object.spec.containers[0].image }} is not from an
          approved registry. Project workspaces may only use quay.io/jupyter/* images.
        pattern:
          spec:
            containers:
              - image: "quay.io/jupyter/*"
            =(initContainers):
              - image: "quay.io/jupyter/*"
