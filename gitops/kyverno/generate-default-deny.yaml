apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-project-default-deny
  annotations:
    policies.kyverno.io/title: Default-deny network policy for projects
    policies.kyverno.io/category: TRE networking
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Any namespace labelled as a research project - including one created by
      hand outside Git - automatically gets a CiliumNetworkPolicy that denies
      all traffic to and from every pod. Allowed traffic is then added
      explicitly (for workspaces: gitops/projects/chart/templates/networkpolicy.yaml).
      "synchronize" makes Kyverno put the policy back if someone deletes it.
spec:
  rules:
    - name: default-deny
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels:
                  k8tre.io/type: project
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: cilium.io/v2
        kind: CiliumNetworkPolicy
        name: default-deny
        namespace: "{{ request.object.metadata.name }}"
        data:
          metadata:
            labels:
              app.kubernetes.io/managed-by: kyverno
          spec:
            description: >-
              Generated by Kyverno. Selects every pod and allows nothing; other
              policies add the traffic that is permitted.
            endpointSelector: {}
            ingress:
              - {}
            egress:
              - {}
