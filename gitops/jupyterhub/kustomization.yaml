apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jupyterhub

resources:
  - ingress.yaml
  - rbac.yaml

# Zero to JupyterHub (Z2JH) Helm chart, inflated by Kustomize inside Argo CD.
helmCharts:
  - name: jupyterhub
    repo: https://hub.jupyter.org/helm-chart/
    version: 4.0.0
    releaseName: jupyterhub
    namespace: jupyterhub
    valuesFile: values.yaml

# The project-aware spawner logic lives in a normal Python file so it can be
# read, linted and tested. The name gets a content hash, so editing the file
# rolls the hub automatically.
configMapGenerator:
  - name: jupyterhub-tre-config
    files:
      - files/tre_config.py

