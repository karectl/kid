# JupyterHub needs to create workspaces in *project* namespaces, not just its
# own. Instead of a cluster-wide grant, we define the permissions once here and
# each project binds them in its own namespace (gitops/projects/chart/templates/rbac.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tre-workspace-spawner
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, secrets, services]
    verbs: [get, watch, list, create, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, watch, list]
---
# The only cluster-wide right the hub has: read namespaces, to discover which
# research projects exist (namespaces labelled k8tre.io/type=project).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tre-project-reader
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jupyterhub-project-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tre-project-reader
subjects:
  - kind: ServiceAccount
    name: hub
    namespace: jupyterhub
