# Static validation of the dev container scripts, GitOps manifests, the
# JupyterHub project logic and the Kyverno policies. The full cluster needs
# privileged Docker, so it is not started here - do a dry run in a codespace.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HELM_VERSION: v3.16.3
  KUSTOMIZE_VERSION: v5.4.3
  KUBECONFORM_VERSION: v0.6.7
  KYVERNO_VERSION: v1.13.2

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C "$HOME/bin"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: pip install pyyaml
      - run: scripts/validate.sh

  jupyterhub-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: pytest -v tests

  kyverno-policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: kyverno/action-install-cli@v0.2.0
        with:
          release: ${{ env.KYVERNO_VERSION }}
      - run: kyverno test tests/kyverno

  jupyterhub-e2e:
    # Real hub + proxy against a mock Keycloak and a fake Kubernetes API; the
    # Pod KubeSpawner creates is then checked against schemas and policies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: kyverno/action-install-cli@v0.2.0
        with:
          release: ${{ env.KYVERNO_VERSION }}
      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C "$HOME/bin"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: pip install -r tests/requirements.txt
      - run: tests/e2e/run.sh
