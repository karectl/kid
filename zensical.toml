# Documentation site for KID (KARECTL in Docker), built with Zensical.
#   Local preview:  pip install zensical && zensical serve
#   Build:          zensical build --clean      (output in ./site)
# Published to GitHub Pages by .github/workflows/docs.yml

[project]
site_name = "KID: KARECTL in Docker"
site_description = "Hands-on training environment for Kubernetes-based Trusted Research Environments"
site_url = "https://karectl.github.io/kid/"
repo_url = "https://github.com/karectl/kid"
repo_name = "karectl/kid"
edit_uri = "edit/main/docs/"
copyright = "Copyright (c) 2026 Lancashire Teaching Hospitals NHS Foundation Trust. Training material for the K8TRE community. Demo credentials only: never use this environment for real data."

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/index.md",
    "getting-started/codespaces.md",
    "getting-started/local.md",
    "getting-started/first-steps.md",
    "getting-started/coding-agents.md",
  ] },
  { "Concepts" = [
    "concepts/kubernetes-primer.md",
    "concepts/tre-on-kubernetes.md",
    "concepts/architecture.md",
    "concepts/workspace-lifecycle.md",
  ] },
  { "Components" = [
    "components/index.md",
    "components/cilium-hubble.md",
    "components/jupyterhub.md",
    "components/keycloak.md",
    "components/storage.md",
    "components/argocd.md",
    "components/kyverno.md",
    "components/kubescape.md",
  ] },
  { "Labs" = [
    "labs/index.md",
    "labs/01-orientation.md",
    "labs/02-workspaces.md",
    "labs/03-project-isolation.md",
    "labs/04-internet-egress.md",
    "labs/05-storage.md",
    "labs/06-resources.md",
    "labs/07-new-project.md",
    "labs/08-kyverno.md",
    "labs/09-kubescape.md",
    "labs/10-challenges.md",
  ] },
  { "Reference" = [
    "reference/cheatsheet.md",
    "reference/repo-layout.md",
    "reference/troubleshooting.md",
    "reference/resource-budget.md",
    "reference/versions.md",
    "reference/glossary.md",
  ] },
  { "Facilitators" = [
    "facilitator/index.md",
    "facilitator/implementation-plan.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep-purple"
accent = "deep-purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep-purple"
accent = "deep-purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
