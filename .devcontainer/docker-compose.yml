services:
  devcontainer:
    build:
      context: .
      dockerfile: devcontainer.Dockerfile
    container_name: kid-devcontainer
    volumes:
      - ..:/workspace:cached
      - k8s-config:/kubeconfig:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: /bin/sh -c "while sleep 1000; do :; done"
    user: vscode
    links:
      - k3s-server

  k3s-server:
    image: "rancher/k3s:${K3S_VERSION:-v1.31.5-k3s1}"
    hostname: k3s-server
    # Mounts for Cilium, upstream DNS selection, then k3s: see k3s-entrypoint.sh.
    entrypoint: ["/bin/sh", "/kid/k3s-entrypoint.sh"]
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    privileged: true
    restart: always
    environment:
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=666
      # Upstream DNS for the cluster. Empty = use the servers Docker uses
      # (works on networks that block public DNS). Example: 8.8.8.8
      - KID_UPSTREAM_DNS=${KID_UPSTREAM_DNS:-}
    volumes:
      - k3s-server:/var/lib/rancher/k3s
      - k8s-config:/output
      - ./k3s-entrypoint.sh:/kid/k3s-entrypoint.sh:ro
    ports:
      - "${TRE_HTTP_PORT:-80}:80"

volumes:
  k3s-server: {}
  k8s-config: {}
